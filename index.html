<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          function makeWritable(obj) {
            if (!obj) return;
            try {
              const desc = Object.getOwnPropertyDescriptor(obj, 'fetch');
              if (desc && desc.get && !desc.set) {
                Object.defineProperty(obj, 'fetch', {
                  get: desc.get,
                  set: function(val) {
                    try {
                      Object.defineProperty(this, 'fetch', {
                        value: val,
                        writable: true,
                        configurable: true,
                        enumerable: true,
                      });
                    } catch (_) {
                      this._fetch = val;
                    }
                  },
                  configurable: true,
                  enumerable: desc.enumerable !== false,
                });
              }
            } catch (_) {}
          }

          let p = window;
          while (p) {
            makeWritable(p);
            p = Object.getPrototypeOf(p);
          }

          if (typeof window.fetch === 'function') {
            const orig = window.fetch.bind(window);
            try {
              Object.defineProperty(window, 'fetch', {
                value: orig,
                writable: true,
                configurable: true,
                enumerable: true,
              });
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
